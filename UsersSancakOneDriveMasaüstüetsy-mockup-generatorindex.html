  <!-- Ücretsiz İndirme (Video + Reklam) Ekranı -->
  <div id="download-modal" class="modal-overlay hidden">
    <div class="modal-box download-box">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <h3 data-i18n="dlTitle">Free Download</h3>
          <span class="modal-subtitle" id="dl-subtitle" data-i18n="dlSub">Preparing mockup</span>
        </div>
        <button id="dl-close" class="remove-btn modal-close-btn" title="Kapat" data-i18n-title="closeTitle">✕</button>
      </div>

      <!-- Reklam İçerik Alanı -->
      <div id="ad-container" class="ad-container">
        <div class="ad-player">
          <div id="ad-video-placeholder" class="ad-video-placeholder">
            <div class="ad-content">
              <div class="ad-badge" data-i18n="adBadge">AD</div>
              <div id="ad-text" class="ad-text" data-i18n="adText">Watch this short video to download for free</div>
              <div id="ad-brand" class="ad-brand">Sponsored Content</div>
            </div>
          </div>
        </div>

        <!-- Geri Sayım ve İlerleme Çubuğu -->
        <div class="ad-timer-section">
          <div class="ad-progress-bar">
            <div id="ad-progress-fill" class="ad-progress-fill"></div>
          </div>
          <div class="ad-timer-row">
            <span id="ad-countdown" class="ad-countdown">15s</span>
            <span id="ad-status" class="ad-status" data-i18n="adStatus">Please wait...</span>
          </div>
        </div>

        <!-- İndirme Butonu (Reklam bitince aktif olur) -->
        <div class="dl-actions">
          <button id="dl-start-download" class="primary-btn" disabled data-i18n="dlDownloadBtn">
            <span class="btn-icon">⬇</span> Download Now
          </button>
        </div>
      </div>

      <div class="dl-actions">
        <button id="dl-cancel" class="secondary-btn" data-i18n="dlCancel">Cancel</button>
      </div>
    </div>
  </div>
